[monitor]
monitor_side = 0
auto_switch_monitor_side = true

[episode]
opponent_agent = "selfplay"
eval_interval = 10
# 训练中评估建议一次只选择一个对手。可选 common_ai，或 kaiwu.json/model_pool 中的一个模型 ID。
# 如需分别对比 260205、260218、260224 或 common_ai，建议分多次训练/评估任务切换此字段。
eval_opponent_type = "260205"

[[lineups.blue_camp]]
# 默认阵容仅作为 env.reset 配置模板。训练工作流会在每局开始前用 [112, 133] 的全组合轮转覆盖这里。
hero_id = 112
# 环境实际校验字段名为 select_skill；训练工作流会在每局 init_config 后覆盖。
select_skill = 80102
summoner_skill_id = 80102

[[lineups.red_camp]]
# 默认阵容仅作为 env.reset 配置模板。训练工作流会在每局开始前用 [112, 133] 的全组合轮转覆盖这里。
hero_id = 112
# 环境实际校验字段名为 select_skill；训练工作流会在每局 init_config 后覆盖。
select_skill = 80102
summoner_skill_id = 80102
